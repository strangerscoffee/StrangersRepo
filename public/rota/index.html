<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" crossorigin="anonymous">
<meta name="robots" content="noindex,nofollow">
<title>Strangers Coffee - Rota</title>
<meta name="theme-color" content="#edf1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#05070b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rota">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<script src="/errors.js"></script>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/rota/rota.css">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<!-- The staff rota (rota.js). Same look and chrome as the diary: top bar and tab bar on phones and tablets,
     a sidebar on wide screens. Its data comes from /api/rota/* (src/rota.ts). -->
<header class="appbar" id="appbar">
  <div class="abrand"><span class="brandmark" role="img" aria-label="Strangers Coffee"></span><span class="rtag">Rota</span></div>
  <button class="avatar" type="button" id="avatarBtn" aria-haspopup="menu" aria-label="Account"></button>
</header>
<aside class="sidebar" id="sidebar">
  <span class="brandlogo sbrand" role="img" aria-label="Strangers Coffee Company"></span>
  <div class="rtag big">Staff rota</div>
  <nav class="snav" id="snav" aria-label="Sections"></nav>
  <button class="mebox" type="button" id="meBox" aria-haspopup="menu"></button>
</aside>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<div class="sheetveil" id="sheetVeil" hidden></div>
<div class="sheet rsheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
<div class="sheet" id="peopleSheet" role="dialog" aria-modal="true" aria-labelledby="peopleSheetTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <h2 id="peopleSheetTitle">Switch person</h2>
  <div class="list" id="peopleList"></div>
  <p class="note" id="peopleNote"></p>
</div>
<div class="menu" id="acctMenu" role="menu" aria-label="Account" hidden></div>
<div class="conn" id="conn" role="status" hidden></div>

<main class="wrap rwrap" id="main">
  <div class="pagehead" id="pagehead">
    <button class="back" type="button" id="backBtn" hidden></button>
    <div class="trow"><div class="ptitle"><h1 id="pageTitle">Rota</h1><p id="pageSub"></p></div><div class="headctl" id="pageAction"></div></div>
  </div>
  <div id="page" class="stack"><div class="empty">Loading…</div></div>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/shared/core.js"></script>
<script src="/pinpad.js"></script>
<script src="/rota/leave.js"></script>
<script src="/rota/sickness.js"></script>
<script src="/rota/rota.js"></script>
</body>
</html>
