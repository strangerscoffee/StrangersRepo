<!doctype html>
<html lang="en-GB" data-sc-staff>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" crossorigin="anonymous">
<meta name="robots" content="noindex,nofollow">
<title>Strangers Coffee - Rota</title>
<meta name="theme-color" content="#edf1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#05070b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rota">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<script src="/errors.js"></script>
<script src="/shared/focus.js" defer></script>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/rota/rota.css">
<link rel="stylesheet" href="/shared/staff-navigation.css">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body class="staff-app">
<header class="appbar" id="appbar">
  <div class="staff-brand"><span class="brandmark" aria-hidden="true"></span><span>Rota</span></div>
  <nav class="staff-workspaces staff-workspaces-wide" data-staff-workspaces aria-label="Staff workspaces" hidden></nav>
  <button class="avatar staff-header-actions" type="button" id="avatarBtn" aria-haspopup="menu" aria-controls="acctMenu" aria-expanded="false" aria-label="Account"></button>
</header>
<aside class="sidebar" id="sidebar">
  <div class="rtag big">Staff rota</div>
  <nav class="snav" id="snav" aria-label="Rota sections"></nav>
</aside>
<nav class="staff-workspaces staff-workspaces-dock" data-staff-workspaces aria-label="Staff workspaces" hidden></nav>

<div class="sheetveil" id="sheetVeil" hidden></div>
<div class="sheet rsheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" hidden inert></div>
<div class="sheet rsheet" id="peopleSheet" role="dialog" aria-modal="true" aria-labelledby="peopleSheetTitle" tabindex="-1" hidden inert>
  <div class="grab" aria-hidden="true"></div>
  <div class="shead">
    <button type="button" class="linkbtn" id="closePeopleSheet">Close</button>
    <h2 id="peopleSheetTitle">Switch person</h2>
    <span></span>
  </div>
  <div class="list" id="peopleList"></div>
  <p class="note" id="peopleNote"></p>
</div>
<div class="menu" id="acctMenu" role="menu" aria-label="Account" tabindex="-1" hidden inert></div>
<div class="conn" id="conn" role="status" hidden></div>

<main class="wrap rwrap" id="main">
  <nav class="staff-section-tabs" id="tabbar" aria-label="Rota sections"></nav>
  <div class="pagehead" id="pagehead">
    <button class="back" type="button" id="backBtn" hidden></button>
    <div class="trow"><div class="ptitle"><h1 id="pageTitle" tabindex="-1">Rota</h1><p id="pageSub"></p></div><div class="headctl" id="pageAction"></div></div>
  </div>
  <div id="page" class="stack"><div class="sc-skeleton sc-skeleton-list" role="status" aria-label="Loading your rota…"><span class="sc-sr-only">Loading your rota…</span><div class="sc-sk-shapes" aria-hidden="true"><div class="sc-sk-card"><span class="sc-sk-bar sc-sk-icon"></span><div class="sc-sk-copy"><span class="sc-sk-bar sc-sk-title"></span><span class="sc-sk-bar sc-sk-line"></span><span class="sc-sk-bar sc-sk-short"></span></div></div><div class="sc-sk-card"><span class="sc-sk-bar sc-sk-icon"></span><div class="sc-sk-copy"><span class="sc-sk-bar sc-sk-title"></span><span class="sc-sk-bar sc-sk-line"></span><span class="sc-sk-bar sc-sk-short"></span></div></div><div class="sc-sk-card"><span class="sc-sk-bar sc-sk-icon"></span><div class="sc-sk-copy"><span class="sc-sk-bar sc-sk-title"></span><span class="sc-sk-bar sc-sk-line"></span><span class="sc-sk-bar sc-sk-short"></span></div></div></div></div></div>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/shared/core.js"></script>
<script src="/shared/staff-navigation.js"></script>
<script src="/pinpad.js"></script>
<script src="/rota/leave.js"></script>
<script src="/rota/sickness.js"></script>
<script src="/rota/rota.js"></script>
</body>
</html>
