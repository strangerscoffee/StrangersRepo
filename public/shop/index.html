<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Explore speciality coffee, brew guides and Strangers Coffee Company’s locations in Norwich.">
  <title>Strangers Coffee Company</title>
  <link rel="icon" type="image/svg+xml" href="/shop/mark.svg">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/shop/shop.css">
  <script type="module" src="/shop/shop.js"></script>
</head>
<body class="retail">
  <a class="skip" href="#main">Skip to content</a>
  <div class="shop-wrap">
    <header class="shop-header glass">
      <a class="wordmark" href="/shop/" aria-label="Strangers Coffee Company home">
        <img src="/shop/mark.svg" width="32" height="34" alt="">
        <span><strong>Strangers</strong><small>Coffee Company</small></span>
      </a>
      <nav class="shop-nav" aria-label="Main navigation">
        <a href="/shop/coffee/" data-nav="coffee">Shop coffee</a>
        <a href="/shop/locations/" data-nav="locations">Locations</a>
        <a href="/shop/brew-guides/" data-nav="brew-guides">Brew guides</a>
        <a href="/shop/about/" data-nav="about">About</a>
      </nav>
      <a class="shop-button soft basket-link" href="/shop/basket/" id="basket-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5h17l-2 11h-13zM9 10V6a3 3 0 0 1 6 0v4"/></svg>
        <span>Basket</span><span class="basket-count" id="basket-count" hidden></span>
      </a>
    </header>
    <main id="main" tabindex="-1" aria-busy="true">
      <div class="loading" role="status">Loading the shop…</div>
      <noscript><p>Enable JavaScript to use the preview shop, or <a href="https://strangerscoffee.com/coffee">visit the live shop</a>.</p></noscript>
    </main>
    <footer class="shop-footer">
      <div class="footer-brand">
        <a class="wordmark" href="/shop/"><img src="/shop/mark.svg" width="32" height="34" alt=""><span>Strangers Coffee Company</span></a>
        <p>Roasted on Dove Street, Norwich.</p>
      </div>
      <nav aria-label="Shop information"><a href="/shop/contact/">Contact</a><a href="/shop/shipping/">Delivery &amp; returns</a><a href="https://strangerscoffee.com/privacy-policy">Privacy</a><a href="https://strangerscoffee.com/terms-conditions">Terms</a><a href="https://strangerscoffee.trade/">Wholesale</a></nav>
      <p class="footer-preview">Public shop preview · <a href="https://strangerscoffee.com/">Visit the live site</a></p>
    </footer>
  </div>
  <div class="shop-toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
