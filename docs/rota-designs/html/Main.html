<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1180">
<title>Rota, week by site · Strangers rota design</title>
<style>
body{margin:0}
.pad{width:1180px;height:820px;box-sizing:border-box;display:flex;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;color:#0b1220;background:radial-gradient(42% 38% at 8% 4%,rgba(0,122,255,.18),transparent 70%),radial-gradient(36% 32% at 96% 14%,rgba(48,209,178,.14),transparent 70%),radial-gradient(48% 40% at 78% 96%,rgba(255,159,10,.12),transparent 70%),#edf1f6}
.side{width:236px;flex:none;box-sizing:border-box;padding:16px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid rgba(60,72,92,.15);background:rgba(255,255,255,.55)}
.sitebtn{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.8);border:1px solid #fff;font:inherit;font-weight:700;font-size:16px;margin-bottom:10px;color:#0b1220}
.nav{display:flex;align-items:center;gap:12px;min-height:38px;padding:0 12px;border-radius:12px;font-weight:600;font-size:15px;color:#0b1220;text-decoration:none}
.nav svg{color:#0062cc}
.nav.on{background:#0062cc;color:#fff}.nav.on svg{color:#fff}
.h{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:#545f70;padding:10px 12px 2px}
.new{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;color:#fff;background:#8944ab;padding:2px 6px;border-radius:6px;margin-left:auto}
.nav.on .new{background:#fff;color:#0062cc}
.main{flex:1;min-width:0;padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:flex-end;gap:10px 12px;flex-wrap:wrap}
h1{margin:0;font-size:34px;letter-spacing:-.03em;line-height:1.05}
.sub{margin:2px 0 0;color:#545f70;font-size:15px}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid #fff;background:rgba(255,255,255,.7);color:#0062cc}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;padding:3px;border-radius:12px;background:rgba(118,128,148,.14);width:200px}
.seg a{display:grid;place-items:center;height:34px;border-radius:9px;font-weight:600;font-size:14px;color:#0b1220;text-decoration:none}
.seg a.on{background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.15)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:99px;border:0;font:inherit;font-weight:650;font-size:14.5px;background:rgba(0,98,204,.10);color:#0062cc;white-space:nowrap}
.btn.pri{background:#0062cc;color:#fff}
.issues{display:flex;gap:8px;flex-wrap:wrap}
.issue{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 6px 0 12px;border-radius:99px;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.75);border:1px solid #fff}
.issue .k{width:8px;height:8px;border-radius:50%}
.issue button{border:0;background:rgba(0,98,204,.10);color:#0062cc;font:inherit;font-weight:650;font-size:13px;border-radius:99px;padding:4px 10px}
.grid{background:rgba(255,255,255,.66);border:1px solid #fff;border-radius:22px;box-shadow:0 10px 30px -8px rgba(16,24,40,.12);overflow:hidden}
.row{display:grid;grid-template-columns:118px repeat(7,minmax(0,1fr));border-top:1px solid rgba(60,72,92,.13)}
.row.hd{border-top:0;background:rgba(255,255,255,.5)}
.cell{padding:6px 5px;display:flex;flex-direction:column;gap:5px;min-width:0;border-left:1px solid rgba(60,72,92,.08)}
.lab{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.lab b{font-size:15px}
.lab span{font-size:12px;color:#545f70}
.dh{padding:8px 8px;display:flex;flex-direction:column;border-left:1px solid rgba(60,72,92,.08)}
.dh b{font-size:13.5px}
.dh span{font-size:11.5px;color:#545f70}
.chip{border-radius:10px;padding:5px 7px;background:#fff;border:1px solid rgba(60,72,92,.14);display:flex;flex-direction:column;gap:1px;min-width:0}
.chip .tm{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.chip .wh{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .tg{font-size:10.5px;font-weight:700;color:#545f70;text-transform:uppercase;letter-spacing:.04em}
.chip.gap{background:rgba(255,59,48,.06);border:1.5px dashed #c0261b}
.chip.gap .wh,.chip.gap .tg{color:#a3201a;font-weight:700}
.chip.clash{background:rgba(255,159,10,.18);border-color:#b36b00}
.chip.clash .tg{color:#7a4500}
.chip.closed{background:none;border:0;padding:5px 2px}
.chip.closed .tm{color:#8a93a3;font-weight:600}
.legend{display:flex;gap:16px;font-size:12.5px;color:#545f70;align-items:center}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

body{background:#d9dee6}
</style>
</head>
<body>
<!-- Design reference for the Strangers Coffee rota (1180×820). Example data only. -->
<div id="design"></div>
<template id="tpl">

<div class="pad">
  <nav class="side" aria-label="Sections">
    <button class="sitebtn" type="button" aria-label="Site: all sites. Change site"><span style="width:9px;height:9px;border-radius:50%;background:#0062cc"></span>All sites</button>
    <a class="nav" href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4M9 14.5l2 2 4-4"/></svg>Today</a>
    <a class="nav" href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>This week</a>
    <a class="nav on" href="#" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 11a3 3 0 100-6M21 20c0-3-1.8-5.2-4.5-5.8"/></svg>Rota<span class="new">NEW</span></a>
    <div class="h">Records</div>
    <a class="nav" href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h6v12H9zM10 9V6h4v3"/></svg>Cleaning</a>
    <a class="nav" href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14V5a2 2 0 014 0v9a4 4 0 11-4 0z"/></svg>Prove it</a>
    <div class="h">Management</div>
    <a class="nav" href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/></svg>Staff training</a>
    <a class="nav" href="#"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Setup</a>
  </nav>

  <div class="main">
    <div class="head">
      <div><h1>Rota</h1><p class="sub">Week of 9 November · draft, not published · {{totalHours}} hours</p></div>
      <div class="tools">
        <button class="ic" type="button" aria-label="Previous week"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="ic" type="button" aria-label="Next week"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        <div class="seg" role="tablist" aria-label="View"><a class="on" href="#" role="tab" aria-selected="true">By site</a><a href="WeekByPerson.dc.html" role="tab" aria-selected="false">By person</a></div>
        <button class="btn" type="button">Copy last week</button>
        <button class="btn pri" type="button">Publish</button>
      </div>
    </div>

    <div class="issues" aria-label="Before you publish">
      <span class="issue"><span class="k" style="background:#c0261b"></span>3 open shifts<button type="button">Fill</button></span>
      <span class="issue"><span class="k" style="background:#b36b00"></span>Sam is at ASG and Cafe on Thursday<button type="button">Fix</button></span>
      <span class="issue"><span class="k" style="background:#b36b00"></span>Ben is 3h over contract<button type="button">See</button></span>
      <span class="issue"><span class="k" style="background:#545f70"></span>Lena on holiday Wed–Thu</span>
    </div>

    <div class="grid" role="table" aria-label="Rota by site">
      <div class="row hd" role="row">
        <div class="lab" role="columnheader"><span>Site</span></div>
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7"><div class="dh" role="columnheader"><b>{{d.label}}</b><span>{{d.count}}</span></div></sc-for>
      </div>
      <sc-for list="{{sites}}" as="s" hint-placeholder-count="3">
        <div class="row" role="row">
          <div class="lab" role="rowheader"><b>{{s.name}}</b><span>{{s.sub}}</span></div>
          <sc-for list="{{s.days}}" as="day" hint-placeholder-count="7">
            <div class="cell" role="cell">
              <sc-for list="{{day.shifts}}" as="c" hint-placeholder-count="2">
                <div class="chip {{c.cls}}"><span class="tm">{{c.time}}</span><span class="wh">{{c.who}}</span><span class="tg">{{c.tag}}</span></div>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </sc-for>
      <div class="row" role="row">
        <div class="lab" role="rowheader"><b>Factory</b><span>Not in use yet</span></div>
        <div class="cell" style="grid-column:span 7;justify-content:center;color:#545f70;font-size:13px;padding-left:12px">No shifts. Add opening days in Setup to plan this site.</div>
      </div>
    </div>

    <div class="legend"><span><span class="lg" style="background:#fff;border:1px solid rgba(60,72,92,.3)"></span>Shift</span><span><span class="lg" style="border:1.5px dashed #c0261b"></span>Open shift</span><span><span class="lg" style="background:rgba(255,159,10,.35)"></span>Clash</span><span>Tap a shift to change it · drag to move or copy (hold Alt)</span></div>
  </div>
</div>
</template>
<script>class DCLogic { constructor() { this.props = {}; this.state = {}; } setState() {} }

class Component extends DCLogic {
renderVals() {
const DAYS = ["Mon 9", "Tue 10", "Wed 11", "Thu 12", "Fri 13", "Sat 14", "Sun 15"];
const SITES = [
{ id: "R", name: "Roastery", sub: "Mon–Fri", open: [1, 1, 1, 1, 1, 0, 0] },
{ id: "C", name: "Cafe", sub: "Every day", open: [1, 1, 1, 1, 1, 1, 1] },
{ id: "A", name: "ASG", sub: "Mon–Sat", open: [1, 1, 1, 1, 1, 1, 0] }
];
const SH = [
["R",0,"07:00","15:00","George","Opens"],["R",0,"08:30","17:00","Tom","Closes"],
["R",1,"07:00","15:00","George","Opens"],["R",1,"08:30","17:00","Tom","Closes"],
["R",2,"07:00","15:00","Tom","Opens"],["R",2,"09:00","17:00","Mia","Closes"],
["R",3,"07:00","15:00","George","Opens"],["R",3,"08:30","17:00","Tom","Closes"],
["R",4,"07:00","15:00","Mia","Opens"],
["C",0,"06:45","14:45","Alex","Opens"],["C",0,"11:00","18:30","Priya","Closes"],
["C",1,"06:45","14:45","Alex","Opens"],["C",1,"11:00","18:30","Priya","Closes"],
["C",2,"06:45","14:45","Kai","Opens"],["C",2,"11:00","18:30","Priya","Closes"],
["C",3,"06:45","14:45","Alex","Opens"],["C",3,"11:00","18:30","Sam","Closes"],
["C",4,"06:45","14:45","Alex","Opens"],["C",4,"11:00","18:30","Kai","Closes"],["C",4,"12:00","16:00","Ben",""],
["C",5,"07:30","15:30","Ellie","Opens"],["C",5,"09:00","13:00","Lena",""],
["C",6,"08:00","16:00","Ellie","Opens"],["C",6,"10:00","17:00","Ben","Closes"],
["A",0,"07:00","15:00","Sam","Opens"],["A",0,"10:00","18:00","Ben","Closes"],
["A",1,"07:00","15:00","Sam","Opens"],["A",1,"10:00","18:00","Lena","Closes"],
["A",2,"07:00","15:00","Alex","Opens"],["A",2,"10:00","18:00","Ben","Closes"],
["A",3,"07:00","15:00","Sam","Opens"],["A",3,"10:00","18:00","Mia","Closes"],
["A",4,"07:00","15:00","Sam","Opens"],
["A",5,"08:00","16:00","Priya","Opens"],["A",5,"10:00","18:00","Kai","Closes"]
];
const GAPS = [["R",4,"08:30","17:00"],["C",5,"11:00","18:30"],["A",4,"10:00","18:00"]];
const mins = (t) => { const p = t.split(":"); return Number(p[0]) * 60 + Number(p[1]); };
const clash = {};
SH.forEach((x, i) => SH.forEach((y, j) => {
if (i < j && x[1] === y[1] && x[4] === y[4] && mins(x[2]) < mins(y[3]) && mins(y[2]) < mins(x[3])) { clash[i] = true; clash[j] = true; }
}));
const sites = SITES.map((s) => ({
name: s.name, sub: s.sub,
days: DAYS.map((label, d) => {
if (!s.open[d]) return { shifts: [{ cls: "closed", time: "Closed", who: "", tag: "" }] };
const list = SH.map((x, i) => ({ x: x, i: i }))
.filter((o) => o.x[0] === s.id && o.x[1] === d)
.sort((a, b) => mins(a.x[2]) - mins(b.x[2]))
.map((o) => ({ cls: clash[o.i] ? "clash" : "", time: o.x[2] + "–" + o.x[3], who: o.x[4], tag: clash[o.i] ? "Clash" : o.x[5] }));
GAPS.filter((g) => g[0] === s.id && g[1] === d).forEach((g) => list.push({ cls: "gap", time: g[2] + "–" + g[3], who: "Open shift", tag: "Closes · fill" }));
return { shifts: list };
})
}));
const days = DAYS.map((label, d) => {
const people = {};
SH.forEach((x) => { if (x[1] === d) people[x[4]] = true; });
const n = Object.keys(people).length;
return { label: label, count: n ? n + " people" : "—" };
});
const total = SH.reduce((t, x) => t + (mins(x[3]) - mins(x[2])) / 60, 0);
return { sites: sites, days: days, totalHours: String(total) };
}
}


function get(ctx, path) { return path.trim().split(".").reduce((o, k) => (o == null ? undefined : o[k]), ctx); }
function interp(s, ctx) { return s.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (_, p) => { const v = get(ctx, p); return v == null ? "" : String(v); }); }
function render(node, ctx) {
  if (node.nodeType === 3) { if (node.nodeValue.includes("{{")) node.nodeValue = interp(node.nodeValue, ctx); return; }
  if (node.nodeType !== 1) return;
  if (node.tagName === "SC-FOR") {
    const list = get(ctx, node.getAttribute("list").replace(/[{}\s]/g, "")) || [];
    const as = node.getAttribute("as");
    const frag = document.createDocumentFragment();
    list.forEach((item, i) => {
      for (const ch of node.childNodes) {
        const wrap = document.createElement("div");
        wrap.appendChild(ch.cloneNode(true));
        render(wrap.firstChild, Object.assign({}, ctx, { [as]: item, $index: i }));
        while (wrap.firstChild) frag.appendChild(wrap.firstChild);
      }
    });
    node.replaceWith(frag);
    return;
  }
  for (const a of [...node.attributes]) if (a.value.includes("{{")) a.value = interp(a.value, ctx);
  for (const ch of [...node.childNodes]) render(ch, ctx);
}
const vals = new Component().renderVals();
const host = document.getElementById("design");
host.appendChild(document.getElementById("tpl").content.cloneNode(true));
for (const ch of [...host.childNodes]) render(ch, vals);
</script>
</body>
</html>
