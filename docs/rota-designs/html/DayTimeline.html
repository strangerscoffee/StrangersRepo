<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>One site, one day · Strangers rota design</title>
<style>
body{margin:0}
.ph{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;color:#0b1220;background:radial-gradient(42% 38% at 8% 4%,rgba(0,122,255,.18),transparent 70%),radial-gradient(36% 32% at 96% 14%,rgba(48,209,178,.14),transparent 70%),#edf1f6;padding:14px 16px 120px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center}
.site{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);font:inherit;font-weight:700;font-size:17px;color:#0b1220}
.back{color:#0062cc;font-weight:600;font-size:16px;text-decoration:none}
h1{margin:0;font-size:32px;letter-spacing:-.03em;line-height:1.05}
.sub{margin:2px 0 0;color:#545f70;font-size:15px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:8px;border-radius:18px;background:rgba(255,255,255,.72);border:1px solid #fff}
.dd{display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:11.5px;font-weight:650;color:#545f70;border:0;background:none;font-family:inherit}
.dd b{font-size:16px;color:#0b1220}
.dd.on{background:#0062cc;color:#fff}.dd.on b{color:#fff}
.card{background:rgba(255,255,255,.75);border:1px solid #fff;border-radius:22px;box-shadow:0 10px 30px -8px rgba(16,24,40,.12);padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px}
.axis,.lane{display:grid;grid-template-columns:58px 300px;align-items:center}
.ticks{position:relative;height:16px}
.ticks span{position:absolute;top:0;font-size:10.5px;color:#545f70;transform:translateX(-50%)}
.lane{min-height:40px}
.nm{font-size:13.5px;font-weight:600}
.track{position:relative;height:34px;border-radius:8px;background:repeating-linear-gradient(90deg,rgba(118,128,148,.10) 0 1px,transparent 1px 23.08px)}
.bar{position:absolute;top:3px;height:28px;border-radius:8px;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:650;box-sizing:border-box;white-space:nowrap;overflow:hidden}
.b1{background:rgba(52,199,89,.22);color:#145c2f}
.b2{background:rgba(255,159,10,.28);color:#6b3d00;outline:2px solid #b36b00;outline-offset:-2px}
.ghost{background:repeating-linear-gradient(135deg,rgba(192,38,27,.14) 0 5px,transparent 5px 10px);color:#a3201a;border:1.5px dashed #c0261b}
.cover{display:grid;grid-template-columns:58px 300px;align-items:end}
.cv{display:flex;align-items:flex-end;height:40px;gap:0}
.cv i{flex:1;background:rgba(0,98,204,.35);border-right:1px solid #fff}
.cv i.low{background:rgba(192,38,27,.55)}
.s{font-size:13px;color:#545f70}
.warn{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;background:rgba(255,159,10,.18);font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:99px;border:0;background:#0062cc;color:#fff;font:inherit;font-weight:650;font-size:14px;white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

body{background:#d9dee6}
</style>
</head>
<body>
<!-- Design reference for the Strangers Coffee rota (390×844). Example data only. -->
<div id="design"></div>
<template id="tpl">

<div class="ph">
  <div class="top"><button class="site" type="button" aria-label="Site: Cafe. Change site"><span style="width:9px;height:9px;border-radius:50%;background:#30a14e"></span>Cafe</button></div>
  <div><a class="back" href="#">‹ Rota</a><h1>Thursday 12 Nov</h1><p class="sub">Cafe · open 06:45–18:30 · 2 people</p></div>
  <div class="days" role="tablist" aria-label="Day"><button class="dd" type="button">M<b>9</b></button><button class="dd" type="button">T<b>10</b></button><button class="dd" type="button">W<b>11</b></button><button class="dd on" type="button" aria-selected="true">T<b>12</b></button><button class="dd" type="button">F<b>13</b></button><button class="dd" type="button">S<b>14</b></button><button class="dd" type="button">S<b>15</b></button></div>

  <div class="card" aria-label="Shifts across the day">
    <div class="axis"><span></span><div class="ticks"><span style="left:0">06</span><span style="left:69px">09</span><span style="left:138px">12</span><span style="left:208px">15</span><span style="left:277px">18</span></div></div>
    <div class="lane"><span class="nm">Alex</span><div class="track"><span class="bar b1" style="left:17px;width:185px">06:45–14:45 · Opens</span></div></div>
    <div class="lane"><span class="nm">Sam</span><div class="track"><span class="bar ghost" style="left:23px;width:185px">At ASG till 15:00</span><span class="bar b2" style="left:115px;width:173px">11:00–18:30 · Closes</span></div></div>
    <div class="lane"><span class="nm s">Add</span><div class="track" style="border:1.5px dashed rgba(84,95,112,.35)"></div></div>
    <div class="cover"><span class="s">On shift</span><div class="cv" aria-label="People on shift each hour: 1 from 08:00 to 11:00, below the 2 needed"><i style="height:50%"></i><i style="height:50%"></i><i class="low" style="height:50%"></i><i class="low" style="height:50%"></i><i class="low" style="height:50%"></i><i style="height:100%"></i><i style="height:100%"></i><i style="height:100%"></i><i style="height:100%"></i><i style="height:50%"></i><i style="height:50%"></i><i style="height:50%"></i><i style="height:50%"></i></div></div>
    <span class="s">Red hours are below the 2 people this site needs from 08:00.</span>
  </div>

  <div class="warn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color:#7a4500"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg><span><b>Sam can't be in two places.</b> They're at ASG 07:00–15:00. Move the Cafe close to Kai (free that afternoon) or start Sam at 15:30.</span></div>
  <button class="btn" type="button" style="align-self:flex-start">Give the close to Kai</button>
</div>
</template>
<script>class DCLogic { constructor() { this.props = {}; this.state = {}; } setState() {} }

class Component extends DCLogic {
renderVals() {
return {};
}
}


function get(ctx, path) { return path.trim().split(".").reduce((o, k) => (o == null ? undefined : o[k]), ctx); }
function interp(s, ctx) { return s.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (_, p) => { const v = get(ctx, p); return v == null ? "" : String(v); }); }
function render(node, ctx) {
  if (node.nodeType === 3) { if (node.nodeValue.includes("{{")) node.nodeValue = interp(node.nodeValue, ctx); return; }
  if (node.nodeType !== 1) return;
  if (node.tagName === "SC-FOR") {
    const list = get(ctx, node.getAttribute("list").replace(/[{}\s]/g, "")) || [];
    const as = node.getAttribute("as");
    const frag = document.createDocumentFragment();
    list.forEach((item, i) => {
      for (const ch of node.childNodes) {
        const wrap = document.createElement("div");
        wrap.appendChild(ch.cloneNode(true));
        render(wrap.firstChild, Object.assign({}, ctx, { [as]: item, $index: i }));
        while (wrap.firstChild) frag.appendChild(wrap.firstChild);
      }
    });
    node.replaceWith(frag);
    return;
  }
  for (const a of [...node.attributes]) if (a.value.includes("{{")) a.value = interp(a.value, ctx);
  for (const ch of [...node.childNodes]) render(ch, ctx);
}
const vals = new Component().renderVals();
const host = document.getElementById("design");
host.appendChild(document.getElementById("tpl").content.cloneNode(true));
for (const ch of [...host.childNodes]) render(ch, vals);
</script>
</body>
</html>
